# The pinned demo producer includes replay overrides and a Foundry profile absent from upstream PR #168.
producer_repo = "https://github.com/pegahcarter/frax-oft-upgradeable"
producer_commit = "08ac2bfa99abc92168f5c637c95fdba41a086148"
producer_setup = "pnpm install --frozen-lockfile --ignore-scripts --config.node-linker=hoisted"
expected_forge_version = "1.8.1"

[[run]]
# The producer reads the historical fork settings from [run.env].
script = "scripts/ops/DeprecateChain/DeprecateChain.s.sol:DeprecateChain"

[run.env]
FOUNDRY_PROFILE = "aurora_attest"
DEPRECATE_CHAIN_ID = "1313161554"
TARGET_CHAIN_ID = "252"
SKIP_DEPRECATE_CHAIN_SIM = "true"
DEPRECATE_FORK_RPC_URL = "https://rpc.frax.com"
DEPRECATE_FORK_BLOCK = "41874116"

[run.defaults]
input_format = "tx-builder"
safe_version = "1.3.0"
multisend_address = "0xa1dabef33b3b82c7814b6d82a79e50f4ac44102b"

[[run.claim]]
output_path = "scripts/ops/DeprecateChain/txs/deprecate-1313161554/Deprecate-252-1313161554-FRXUSD.json"
chain_id = "252"
safe_address = "0x5f25218ed9474b721d6a38c115107428e832fa2e"
safe_nonce = "555"
live = false
expected_canonical_sha256 = "aed515d4fcef6d3ec73d743b18296c1dec9d77a0dfcd4ec4ba2b40989adc2b92"
expected_safe_tx_hash = "0x172efcdc827b2736ce406e11292f9f760ce3aea6b09316a3e58e6ac105d84a07"

