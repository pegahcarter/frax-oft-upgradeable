name: Aurora OFT attestation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.17.1'
      - uses: crossecute/forge-attest@e7f58f2e60742759f85d6ad4dd2f3130d4f1ae38
        with:
          config: attest.aurora.toml
          foundry-version: v1.8.1
