name: Aurora OFT attestation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.node-linker=hoisted
      - uses: crossecute/forge-attest@81f37c317170759989575a43dacd7d94ea19efbf
        with:
          config: attest.aurora.toml
          foundry-version: v1.8.1
        env:
          FOUNDRY_PROFILE: aurora_attest
          DEPRECATE_CHAIN_ID: '1313161554'
          TARGET_CHAIN_ID: '252'
          SKIP_DEPRECATE_CHAIN_SIM: 'true'
          DEPRECATE_FORK_RPC_URL: https://rpc.frax.com
          DEPRECATE_FORK_BLOCK: '41874116'
