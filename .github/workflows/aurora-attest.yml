name: Aurora OFT attestation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'
      - uses: crossecute/forge-attest@5918f6ca66f7c8383977890ad8f147a97a4ec042
        with:
          config: attest.aurora.toml
          foundry-version: v1.8.1
